<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>라라스윗 무상노출 트래커</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F6F2;
  --surface: #FFFFFF;
  --border: #E5E3DC;
  --text: #1A1917;
  --muted: #7A7873;
  --accent: #2D6A4F;
  --accent-light: #E8F5EE;
  --accent-text: #1B4332;
  --danger: #C0392B;
  --danger-light: #FDEDEC;
  --mono: 'DM Mono', monospace;
  --sans: 'Noto Sans KR', sans-serif;
  --radius: 10px;
  --radius-sm: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.6; }

header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 32px; display: flex; align-items: center; justify-content: space-between; height: 56px; position: sticky; top: 0; z-index: 100; }
.logo { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; color: var(--text); display: flex; align-items: center; gap: 8px; }
.logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

.tabs { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px; margin-bottom: 24px; width: fit-content; }
.tab { padding: 7px 18px; border-radius: var(--radius-sm); border: none; background: transparent; font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; transition: all 0.15s; }
.tab.active { background: var(--text); color: #fff; }
.tab:hover:not(.active) { background: var(--bg); color: var(--text); }
.pane { display: none; }
.pane.active { display: block; }

.main { max-width: 1400px; margin: 0 auto; padding: 32px 24px; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; }
.stat-label { font-size: 11px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
.stat-val { font-size: 28px; font-weight: 700; letter-spacing: -1px; color: var(--text); font-family: var(--mono); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 16px; }
.card-title { font-size: 13px; font-weight: 700; margin-bottom: 14px; color: var(--text); }

.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.filter-row2 { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }

select, input[type="text"], input[type="date"] { font-family: var(--sans); font-size: 13px; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 12px; background: var(--surface); color: var(--text); outline: none; transition: border-color 0.15s; }
select:focus, input:focus { border-color: var(--accent); }
.search-input { flex: 1; min-width: 160px; }

button.btn { font-family: var(--sans); font-size: 13px; font-weight: 500; border-radius: var(--radius-sm); padding: 7px 14px; cursor: pointer; transition: all 0.15s; border: 1px solid var(--border); background: var(--surface); color: var(--text); display: inline-flex; align-items: center; gap: 5px; }
button.btn:hover { background: var(--bg); }
button.btn:active { transform: scale(0.98); }
button.btn-primary { background: var(--text); color: #fff; border-color: var(--text); }
button.btn-primary:hover { opacity: 0.88; }
button.btn-accent { background: var(--accent); color: #fff; border-color: var(--accent); }
button.btn-accent:hover { opacity: 0.88; }
button.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.period-btn { font-size: 12px; padding: 5px 10px; }
.period-btn.active { background: var(--text); color: #fff; border-color: var(--text); }
.date-sep { font-size: 12px; color: var(--muted); }

.table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; }
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead tr { background: var(--bg); border-bottom: 1px solid var(--border); }
th { padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--bg); }

.badge { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 99px; white-space: nowrap; display: inline-block; }
.badge-blog { background: var(--accent-light); color: var(--accent-text); }
.badge-cafe { background: #EBF5FB; color: #1A5276; }
.badge-manual { background: #F4ECF7; color: #6C3483; }

.td-source { color: var(--muted); font-size: 12px; white-space: nowrap; }
.td-link a { color: var(--accent); font-size: 12px; font-family: var(--mono); text-decoration: none; white-space: nowrap; }
.td-link a:hover { text-decoration: underline; }
.td-date { color: var(--muted); font-size: 12px; white-space: nowrap; font-family: var(--mono); }

.expand-btn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 11px; padding: 2px 4px; margin-top: 4px; display: block; font-family: var(--sans); }
.expand-btn:hover { color: var(--accent); }

.result-count { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.empty { text-align: center; padding: 48px 24px; color: var(--muted); font-size: 14px; line-height: 2; }
.loading { text-align: center; padding: 48px; color: var(--muted); font-size: 13px; }
.updated { font-size: 12px; color: var(--muted); font-family: var(--mono); }
.status-msg { font-size: 12px; color: var(--accent); font-weight: 500; margin-left: 8px; }
.status-err { color: var(--danger); }

.kw-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.kw-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 99px; padding: 5px 12px; font-size: 13px; font-family: var(--mono); color: var(--text); }
.kw-chip button { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 14px; line-height: 1; padding: 0; display: flex; align-items: center; transition: color 0.15s; }
.kw-chip button:hover { color: var(--danger); }
.kw-add-row { display: flex; gap: 8px; align-items: center; }
.notice { background: var(--accent-light); border: 1px solid #a9dfbf; border-radius: var(--radius-sm); padding: 10px 14px; font-size: 12px; color: var(--accent-text); margin-top: 12px; line-height: 1.7; }
.notice-warn { background: #FEF9E7; border-color: #F9E79F; color: #7D6608; }

.progress-bar { background: var(--bg); border-radius: 99px; height: 6px; margin-top: 8px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.3s; }

/* 수동 입력 모달 */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border-radius: var(--radius); padding: 24px; width: 520px; max-width: 90vw; max-height: 80vh; overflow-y: auto; }
.modal-title { font-size: 15px; font-weight: 700; margin-bottom: 16px; }
.form-row { margin-bottom: 12px; }
.form-label { font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 4px; display: block; }
.form-input { width: 100%; font-size: 13px; }
.form-row textarea { width: 100%; font-family: var(--sans); font-size: 13px; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 12px; resize: vertical; outline: none; }
.form-row textarea:focus { border-color: var(--accent); }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    라라스윗 무상노출 트래커
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <span class="updated" id="updated-at"></span>
    <button class="btn" onclick="openManualModal()">+ 수동 입력</button>
    <button class="btn" onclick="exportCSV()">↓ CSV</button>
  </div>
</header>

<!-- 수동 입력 모달 -->
<div class="modal-overlay" id="manual-modal">
  <div class="modal">
    <div class="modal-title">수동 입력</div>
    <div class="form-row">
      <label class="form-label">플랫폼</label>
      <select id="m-platform" class="form-input">
        <option value="인스타그램">인스타그램</option>
        <option value="X (트위터)">X (트위터)</option>
        <option value="유튜브">유튜브</option>
        <option value="기타">기타</option>
      </select>
    </div>
    <div class="form-row">
      <label class="form-label">키워드</label>
      <select id="m-keyword" class="form-input"></select>
    </div>
    <div class="form-row">
      <label class="form-label">채널명 / 계정명</label>
      <input type="text" id="m-source" class="form-input" placeholder="예: @larasweet_official">
    </div>
    <div class="form-row">
      <label class="form-label">제목 / 내용 요약</label>
      <input type="text" id="m-title" class="form-input" placeholder="게시물 제목이나 핵심 내용">
    </div>
    <div class="form-row">
      <label class="form-label">본문 내용 (핵심 문장)</label>
      <textarea id="m-content" rows="3" placeholder="제품 관련 핵심 문장을 그대로 입력해 주세요"></textarea>
    </div>
    <div class="form-row">
      <label class="form-label">URL</label>
      <input type="text" id="m-link" class="form-input" placeholder="https://...">
    </div>
    <div class="form-row">
      <label class="form-label">게시일</label>
      <input type="date" id="m-date" class="form-input">
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeManualModal()">취소</button>
      <button class="btn btn-primary" onclick="saveManual()">저장</button>
    </div>
  </div>
</div>

<div class="main">
  <div class="tabs">
    <button class="tab active" onclick="showTab('results', this)">결과 보기</button>
    <button class="tab" onclick="showTab('keywords', this)">키워드 관리</button>
  </div>

  <!-- 결과 보기 -->
  <div class="pane active" id="pane-results">
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">전체</div><div class="stat-val" id="s-total">—</div></div>
      <div class="stat-card"><div class="stat-label">블로그·카페</div><div class="stat-val" id="s-naver">—</div></div>
      <div class="stat-card"><div class="stat-label">수동 입력</div><div class="stat-val" id="s-manual">—</div></div>
      <div class="stat-card"><div class="stat-label">기간 내 결과</div><div class="stat-val" id="s-filtered">—</div></div>
    </div>

    <div class="filter-bar">
      <select id="f-kw" onchange="render()"><option value="">전체 키워드</option></select>
      <select id="f-pl" onchange="render()">
        <option value="">전체 채널</option>
        <option value="네이버 블로그">블로그</option>
        <option value="네이버 카페">카페</option>
        <option value="인스타그램">인스타그램</option>
        <option value="X (트위터)">X (트위터)</option>
        <option value="유튜브">유튜브</option>
        <option value="기타">기타</option>
      </select>
      <input type="text" class="search-input" id="f-q" placeholder="내용 검색..." oninput="render()">
    </div>

    <div class="filter-row2">
      <button class="btn period-btn active" onclick="setPeriod(7, this)">1주</button>
      <button class="btn period-btn" onclick="setPeriod(30, this)">1개월</button>
      <button class="btn period-btn" onclick="setPeriod(90, this)">3개월</button>
      <button class="btn period-btn" onclick="setPeriod(0, this)">전체</button>
      <span class="date-sep">또는</span>
      <input type="date" id="f-from" onchange="clearPeriodBtn(); render()">
      <span class="date-sep">~</span>
      <input type="date" id="f-to" onchange="clearPeriodBtn(); render()">
      <button class="btn" onclick="resetDates()">초기화</button>
    </div>

    <div class="result-count" id="result-count"></div>

    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>제품(키워드)</th>
              <th>채널</th>
              <th>채널명</th>
              <th>내용</th>
              <th>URL</th>
              <th>게시일</th>
              <th>수집일</th>
            </tr>
          </thead>
          <tbody id="result-tbody">
            <tr><td colspan="7"><div class="loading">데이터 불러오는 중...</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 키워드 관리 -->
  <div class="pane" id="pane-keywords">
    <div class="card">
      <div class="card-title">검색 키워드 관리</div>
      <div class="kw-grid" id="kw-chips"></div>
      <div class="kw-add-row">
        <input type="text" id="new-kw" placeholder="새 키워드 입력..." style="flex:1" onkeydown="if(event.key==='Enter') addKw()">
        <button class="btn btn-accent" id="add-kw-btn" onclick="addKw()">+ 추가 및 즉시 수집</button>
        <span class="status-msg" id="kw-status"></span>
      </div>
      <div id="kw-progress" style="display:none;margin-top:12px">
        <div style="font-size:12px;color:var(--muted)" id="kw-progress-text">수집 중...</div>
        <div class="progress-bar"><div class="progress-fill" id="kw-progress-fill" style="width:0%"></div></div>
      </div>
      <div class="notice" style="margin-top:16px">
        키워드 추가 시 네이버 블로그·카페를 즉시 검색해서 결과에 반영해요.<br>
        GitHub Actions 자동 수집은 매주 화·금 오전 10시에 실행돼요.
      </div>
    </div>

    <div class="card">
      <div class="card-title">키워드별 수집 현황</div>
      <div id="kw-stats"></div>
    </div>
  </div>
</div>

<script>
let allData = JSON.parse(localStorage.getItem('ls_data') || '[]');
let keywords = JSON.parse(localStorage.getItem('ls_keywords') || '["라라스윗요거트바","라라스윗망고요거트바","라라스윗듬뿍바","라라스윗딸기듬뿍바","라라스윗제로바","애플망고생요거트바"]');

function saveAll() {
  localStorage.setItem('ls_keywords', JSON.stringify(keywords));
  localStorage.setItem('ls_data', JSON.stringify(allData));
}

function showTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
  document.getElementById('pane-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'keywords') { renderKwChips(); renderKwStats(); }
}

async function loadData() {
  try {
    const res = await fetch('data.json?t=' + Date.now());
    const remote = await res.json();
    const existingLinks = new Set(allData.map(d => d.link));
    remote.forEach(d => { if (!existingLinks.has(d.link)) allData.push(d); });
    allData.sort((a,b) => b.date.localeCompare(a.date));
    saveAll();
  } catch(e) {}
  updateStats();
  populateFilters();
  setDefaultDates(7);
  render();
  const latest = allData.filter(d=>d.collected).sort((a,b)=>b.collected.localeCompare(a.collected))[0];
  document.getElementById('updated-at').textContent = latest ? '마지막 수집: ' + latest.collected : '';
}

function cleanHtml(t) { return (t||'').replace(/<[^>]+>/g, ''); }

async function searchNaver(keyword) {
  const results = [];
  for (const type of ['blog', 'cafearticle']) {
    try {
      const res = await fetch(`/.netlify/functions/search?query=${encodeURIComponent(keyword)}&type=${type}`);
      const items = await res.json();
      const label = type === 'blog' ? '네이버 블로그' : '네이버 카페';
      items.forEach(item => {
        results.push({
          title: cleanHtml(item.title || ''),
          link: item.link || '',
          platform: label,
          keyword,
          source: cleanHtml(item.bloggername || item.cafename || ''),
          date: parseDate(item.postdate || ''),
          content: cleanHtml(item.description || ''),
          collected: new Date().toISOString().slice(0,10),
        });
      });
    } catch(e) {}
  }
  return results;
}

function parseDate(d) {
  if (!d) return '';
  if (d.length === 8) return d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8);
  try {
    return new Date(d).toISOString().slice(0,10);
  } catch(e) { return d; }
}

function updateStats() {
  document.getElementById('s-total').textContent = allData.length;
  document.getElementById('s-naver').textContent = allData.filter(d=>d.platform==='네이버 블로그'||d.platform==='네이버 카페').length;
  document.getElementById('s-manual').textContent = allData.filter(d=>d.manual).length;
}

function populateFilters() {
  const kws = [...new Set(allData.map(d=>d.keyword))];
  const sel = document.getElementById('f-kw');
  const cur = sel.value;
  sel.innerHTML = '<option value="">전체 키워드</option>' + kws.map(k=>`<option value="${k}"${k===cur?' selected':''}>${k}</option>`).join('');
}

function setDefaultDates(days) {
  if (days === 0) { document.getElementById('f-from').value = ''; document.getElementById('f-to').value = ''; return; }
  document.getElementById('f-to').value = new Date().toISOString().slice(0,10);
  document.getElementById('f-from').value = new Date(Date.now()-days*86400000).toISOString().slice(0,10);
}

function setPeriod(days, btn) {
  document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  setDefaultDates(days);
  render();
}

function clearPeriodBtn() { document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active')); }
function resetDates() { setPeriod(7, document.querySelector('.period-btn')); }

function getFiltered() {
  const kw = document.getElementById('f-kw').value;
  const pl = document.getElementById('f-pl').value;
  const q = document.getElementById('f-q').value.toLowerCase();
  const from = document.getElementById('f-from').value;
  const to = document.getElementById('f-to').value;
  return allData.filter(d =>
    (!kw || d.keyword === kw) &&
    (!pl || d.platform === pl) &&
    (!q || (d.title||'').toLowerCase().includes(q) || (d.content||'').toLowerCase().includes(q) || (d.source||'').toLowerCase().includes(q)) &&
    (!from || d.date >= from) &&
    (!to || d.date <= to)
  );
}

function render() {
  const filtered = getFiltered();
  document.getElementById('s-filtered').textContent = filtered.length;
  document.getElementById('result-count').textContent = filtered.length + '건';
  const tbody = document.getElementById('result-tbody');
  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty">${allData.length ? '검색 결과가 없어요.' : '아직 수집된 데이터가 없어요.'}</div></td></tr>`;
    return;
  }
  tbody.innerHTML = filtered.map((d, i) => {
    const content = d.content || '—';
    const short = content.length > 80 ? content.slice(0, 80) + '...' : content;
    const needsExpand = content.length > 80;
    const badgeClass = d.manual ? 'badge-manual' : (d.platform==='네이버 블로그'?'badge-blog':'badge-cafe');
    const platformLabel = d.platform === '네이버 블로그' ? '블로그' : d.platform === '네이버 카페' ? '카페' : d.platform;
    return `
    <tr>
      <td style="font-weight:700;font-size:12px;white-space:nowrap">${d.keyword}</td>
      <td><span class="badge ${badgeClass}">${platformLabel}</span></td>
      <td class="td-source">${d.source || '—'}</td>
      <td style="max-width:380px">
        <div style="font-weight:500;font-size:13px;margin-bottom:3px">${d.title}</div>
        <div style="color:var(--muted);font-size:12px" id="ct-${i}">${short}</div>
        ${needsExpand ? `<button class="expand-btn" id="eb-${i}" onclick="toggleExpand(${i},${JSON.stringify(content)},${JSON.stringify(short)})">더 보기</button>` : ''}
      </td>
      <td class="td-link">${d.link ? `<a href="${d.link}" target="_blank">원문 보기 →</a>` : '—'}</td>
      <td class="td-date">${d.date}</td>
      <td class="td-date">${d.collected || '—'}</td>
    </tr>`;
  }).join('');
}

function toggleExpand(i, full, short) {
  const el = document.getElementById('ct-' + i);
  const btn = document.getElementById('eb-' + i);
  if (btn.textContent === '더 보기') { el.textContent = full; btn.textContent = '접기'; }
  else { el.textContent = short; btn.textContent = '더 보기'; }
}

function renderKwChips() {
  document.getElementById('kw-chips').innerHTML = keywords.map((k,i) => `
    <div class="kw-chip"><span>${k}</span><button onclick="removeKw(${i})" title="삭제">×</button></div>
  `).join('');
  const sel = document.getElementById('m-keyword');
  if (sel) sel.innerHTML = keywords.map(k=>`<option value="${k}">${k}</option>`).join('');
}

function renderKwStats() {
  const counts = {};
  allData.forEach(d => { counts[d.keyword] = (counts[d.keyword]||0) + 1; });
  const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  if (!sorted.length) { document.getElementById('kw-stats').innerHTML = '<div style="color:var(--muted);font-size:13px">수집된 데이터가 없어요.</div>'; return; }
  document.getElementById('kw-stats').innerHTML = sorted.map(([k,v])=>`
    <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)">
      <span style="flex:1;font-size:13px;font-family:var(--mono)">${k}</span>
      <span style="font-size:13px;font-weight:700;font-family:var(--mono)">${v}건</span>
      <div style="width:120px;height:6px;background:var(--border);border-radius:99px;overflow:hidden">
        <div style="height:100%;background:var(--accent);width:${Math.round(v/sorted[0][1]*100)}%;border-radius:99px"></div>
      </div>
    </div>
  `).join('');
}

async function addKw() {
  const inp = document.getElementById('new-kw');
  const v = inp.value.trim();
  if (!v) return;
  if (keywords.includes(v)) { showStatus('kw-status', '이미 있는 키워드예요.'); return; }

  keywords.push(v);
  saveAll();
  inp.value = '';
  renderKwChips();
  populateFilters();

  // 즉시 수집
  const btn = document.getElementById('add-kw-btn');
  btn.disabled = true;
  const prog = document.getElementById('kw-progress');
  const progText = document.getElementById('kw-progress-text');
  const progFill = document.getElementById('kw-progress-fill');
  prog.style.display = 'block';
  progText.textContent = `"${v}" 검색 중...`;
  progFill.style.width = '30%';

  try {
    const results = await searchNaver(v);
    progFill.style.width = '80%';
    const existing = new Set(allData.map(d=>d.link));
    let added = 0;
    results.forEach(r => { if (r.link && !existing.has(r.link)) { allData.push(r); added++; } });
    allData.sort((a,b) => b.date.localeCompare(a.date));
    saveAll();
    progFill.style.width = '100%';
    progText.textContent = `완료! ${added}건 추가됐어요.`;
    updateStats();
    populateFilters();
    render();
    setTimeout(() => { prog.style.display = 'none'; progFill.style.width = '0%'; }, 2000);
  } catch(e) {
    progText.textContent = '수집 중 오류가 났어요. 나중에 자동 수집에서 반영돼요.';
    setTimeout(() => { prog.style.display = 'none'; }, 3000);
  }
  btn.disabled = false;
  showStatus('kw-status', `"${v}" 추가됐어요!`);
}

function removeKw(i) {
  if (!confirm(`"${keywords[i]}" 키워드를 삭제할까요?`)) return;
  keywords.splice(i, 1);
  saveAll();
  renderKwChips();
  populateFilters();
  showStatus('kw-status', '삭제됐어요.');
}

function showStatus(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  setTimeout(() => el.textContent = '', 2500);
}

// 수동 입력
function openManualModal() {
  document.getElementById('m-date').value = new Date().toISOString().slice(0,10);
  renderKwChips();
  document.getElementById('manual-modal').classList.add('open');
}

function closeManualModal() {
  document.getElementById('manual-modal').classList.remove('open');
  ['m-source','m-title','m-content','m-link'].forEach(id => document.getElementById(id).value = '');
}

function saveManual() {
  const platform = document.getElementById('m-platform').value;
  const keyword = document.getElementById('m-keyword').value;
  const source = document.getElementById('m-source').value.trim();
  const title = document.getElementById('m-title').value.trim();
  const content = document.getElementById('m-content').value.trim();
  const link = document.getElementById('m-link').value.trim();
  const date = document.getElementById('m-date').value;

  if (!title && !content) { alert('제목 또는 내용을 입력해 주세요.'); return; }

  allData.unshift({
    title: title || content.slice(0, 50),
    link,
    platform,
    keyword,
    source,
    date,
    content,
    collected: new Date().toISOString().slice(0,10),
    manual: true,
  });
  saveAll();
  updateStats();
  populateFilters();
  render();
  closeManualModal();
}

function exportCSV() {
  const filtered = getFiltered();
  if (!filtered.length) return alert('데이터가 없어요.');
  const headers = ['수집일','플랫폼','키워드','제목','출처','게시일','내용','링크'];
  const rows = filtered.map(d=>[
    d.collected, d.platform, d.keyword,
    `"${(d.title||'').replace(/"/g,'""')}"`,
    d.source||'', d.date,
    `"${(d.content||'').replace(/"/g,'""')}"`,
    d.link
  ].join(','));
  const csv = '\uFEFF'+[headers.join(','),...rows].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download = `larasweet_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

loadData();
</script>
